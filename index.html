<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<title>Margoth · VincularB Pet ID · DEMO</title>
<style>
:root{
  --p:#ff7a1a; --pt:#1b0f08; --a:#19b6a6;
  --bg:#0b0f17; --card:#141b28; --card2:#1c2638; --tx:#eef2fb; --mut:#a3b0c8; --bd:#28344c;
  --danger:#e5484d; --ok:#2fb344; --r:18px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--font);min-height:100vh;
  background-image:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--p) 22%,transparent),transparent 70%)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.hero{position:relative;margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.cover{height:150px;background:linear-gradient(135deg,var(--p),#7a2f00 55%,var(--a));position:relative}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.4))}
.brandtag{position:absolute;top:10px;left:12px;z-index:2;background:rgba(0,0,0,.5);color:#fff;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px}
.id{padding:0 18px 20px;text-align:center}
.avatar{width:140px;height:140px;border-radius:50%;margin:-70px auto 10px;border:5px solid var(--card);background:var(--card2);overflow:hidden;position:relative;z-index:3;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:56px;height:56px;stroke:var(--mut)}
h1{margin:4px 0 2px;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
.sub{margin:0;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.85rem;border:1px solid transparent}
.badge.safe{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.badge.lost{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger);border-color:var(--danger);animation:pulse 1.6s infinite}
.badge i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.alert{margin-top:14px;background:var(--danger);color:#fff;border-radius:var(--r);padding:14px 16px;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.alert svg{flex:none;width:26px;height:26px;stroke:#fff}
.actions{display:grid;gap:10px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 18px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;text-decoration:none;cursor:pointer;transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--p);color:var(--pt);border-color:transparent;font-size:1.05rem;min-height:60px}
.btn.accent{background:var(--a);color:#04201c;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn svg,.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.card h2{margin:0 0 10px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--p)}
.card p{margin:0;white-space:pre-line}
dl.kv{margin:0}
dl.kv div{display:grid;grid-template-columns:42% 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
dl.kv div:first-child{border-top:0;padding-top:0}
dl.kv dt{color:var(--mut);font-size:.9rem}
dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--card2);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox img{width:128px;height:128px;border-radius:12px;background:#fff;padding:6px}
.qrbox .side{flex:1;min-width:170px;display:grid;gap:8px}
.note{font-size:.82rem;color:var(--mut)}
.note.warn{color:#ffb27a;font-weight:600}
details.how summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.how ol{margin:6px 0 0;padding-left:20px;color:var(--mut);font-size:.92rem}
details.how h3{margin:12px 0 2px;font-size:.95rem}
.legal{font-size:.8rem;color:var(--mut)}
.legal p+p{margin-top:8px}
.vb{margin-top:18px;border-radius:var(--r);padding:18px;background:#0e0e10;color:#f2f2f2;border:1px dashed #5a3a1f}
.vb img.logo{height:44px;width:auto;display:block;border-radius:6px}
.vb p{margin:10px 0 0;font-size:.88rem;color:#c9c9cf}
.vb .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vb .links a{color:#fff;background:#ff7a1a;color:#1b0f08;border-radius:999px;padding:9px 16px;text-decoration:none;font-size:.88rem;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.vb .links a.alt{background:transparent;color:#fff;border:1px solid #5a3a1f}
.demo-bar{margin-top:12px;background:var(--p);color:var(--pt);text-align:center;font-size:.78rem;font-weight:700;padding:7px 10px;border-radius:12px}
.ver{text-align:center;margin-top:12px;font-size:.72rem;color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);padding:0;max-width:min(94vw,560px);width:100%;max-height:92vh}
dialog::backdrop{background:rgba(3,7,16,.75)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card)}
.dlg-h h2{margin:0;font-size:1.1rem}
.dlg-b{padding:16px 18px 20px;display:grid;gap:12px}
.x{background:var(--card2);border:0;border-radius:50%;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.x svg{width:20px;height:20px}
#lightDlg{background:#000;max-width:96vw;width:auto;overflow:hidden}
#lightDlg img{display:block;max-width:96vw;max-height:86vh;margin:0 auto}
#lightDlg .x{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff}
#qrBig{width:min(78vw,380px);height:auto;background:#fff;padding:12px;border-radius:14px;margin:0 auto;display:block}
@media (min-width:600px){.cover{height:190px}}
</style>
</head>

<noscript><p style="padding:20px;font-family:sans-serif">Esta ficha necesita JavaScript habilitado. Demo de VincularB Pet ID: contacto Vincular Business, WhatsApp (387) 448-4132.</p></noscript>
<div id="app"></div>

<dialog id="lightDlg" aria-label="Foto ampliada">

  <img id="lightImg" alt="">
</dialog>
<dialog id="qrDlg" aria-labelledby="qrTitle">
  <div class="dlg-h"><h2 id="qrTitle">Código QR de la ficha</h2>
    <button class="x" type="button" data-close="qrDlg" aria-label="Cerrar"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b">
    <img id="qrBig" alt="Código QR de la ficha" hidden>
    <p class="note" id="qrBigMsg" role="status"></p>
    <button class="btn primary" type="button" id="qrDownload">Descargar para imprenta (PNG)</button>
  </div>
</dialog>
<dialog id="gpsDlg" aria-labelledby="gpsTitle">
  <div class="dlg-h"><h2 id="gpsTitle">Compartir ubicación</h2>
    <button class="x" type="button" data-close="gpsDlg" aria-label="Cerrar"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b">
    <p>Vas a compartir tu ubicación actual <strong>solo con el tutor</strong>, para ayudar a reencontrarse con la mascota. Tu navegador te va a pedir permiso. No se envía nada automáticamente: vos decidís si mandás el mensaje.</p>
    <button class="btn accent" type="button" id="gpsGo">Obtener mi ubicación</button>
    <p class="note" id="gpsMsg" role="status"></p>
    <a class="btn primary" id="gpsSend" target="_blank" rel="noopener noreferrer" hidden>Enviar ubicación por WhatsApp</a>
    <a class="btn" id="gpsMap" target="_blank" rel="noopener noreferrer" hidden>Ver en Google Maps</a>
  </div>
</dialog>

  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;

    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}

  user: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',

  paw: '<circle cx="6" cy="10" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="15" cy="5.5" r="2"/><circle cx="19" cy="10" r="2"/><path d="M12 11c-3 0-6 3.5-6 6.2 0 2 1.6 2.8 3 2.8 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.4 0 3-.8 3-2.8C18 14.5 15 11 12 11z"/>',
  alert: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'
};
function icon(name, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  if (cls) s.setAttribute('class', cls);
  s.innerHTML = ICONS[name] || ''; /* constantes propias, nunca datos del usuario */
  return s;
}
function waNumber(raw) { /* Argentina → 549 + 10 dígitos, o '' si no es válido */
  let d = String(raw || '').replace(/\D/g, '').replace(/^0+/, '');
  if (d.startsWith('54')) { d = d.slice(2); if (d.startsWith('9')) d = d.slice(1); }
  return /^\d{10}$/.test(d) ? '549' + d : '';
}
const prettyPhone = w => w ? '+54 9 ' + w.slice(3, 6) + ' ' + w.slice(6, 9) + '-' + w.slice(9) : '';
function safeUrl(u) { try { const x = new URL(String(u || '').trim()); return x.protocol === 'https:' || x.protocol === 'http:' ? x.href : ''; } catch (e) { return ''; } }
function igUrl(v) {
  v = String(v || '').trim().replace(/^@/, '');
  return /^[A-Za-z0-9._]{1,30}$/.test(v) ? 'https://instagram.com/' + v : '';
}
const fill = (s, tutor, pet) => s.replace(/\{tutor\}/g, tutor).replace(/\{mascota\}/g, pet);
function ageText(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return '';
  const b = new Date(+m[1], +m[2] - 1, +m[3]), n = new Date();
  let y = n.getFullYear() - b.getFullYear(), mo = n.getMonth() - b.getMonth();
  if (n.getDate() < b.getDate()) mo--;
  if (mo < 0) { y--; mo += 12; }
  if (y < 0) return '';
  const parts = []; if (y) parts.push(y + (y === 1 ? ' año' : ' años')); if (mo) parts.push(mo + (mo === 1 ? ' mes' : ' meses'));
  return parts.join(' y ') || 'menos de 1 mes';
}
function birthText(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
const okImg = v => typeof v === 'string' && /^(data:image\/(jpeg|png|webp);base64,|https:\/\/)/.test(v);

/* ---------- URL estable y QR ---------- */
function stableUrl() {
  const c = String(CONFIG.qr.url || '').trim(); if (c) return c;
  if (location.protocol === 'https:') return location.origin + location.pathname;
  return '';
}
function checkUrl(u) {
  let x; try { x = new URL(u); } catch (e) { return { ok: false, msg: '[PENDIENTE] Falta la URL estable definitiva de esta ficha. Se completa en CONFIG.qr.url al publicarla en su dominio https.' }; }
  if (x.protocol !== 'https:') return { ok: false, msg: 'La URL del QR debe ser https:// (no se aceptan file://, http:// ni direcciones temporales).' };
  const h = x.hostname;
  if (h === 'localhost' || h.endsWith('.localhost') || h.endsWith('.test') || /^127\./.test(h) || /^10\./.test(h) || /^192\.168\./.test(h) || /^\[?::1\]?$/.test(h))
    return { ok: false, msg: 'La URL del QR no puede ser localhost ni una dirección local/temporal.' };
  if (/ejemplo|example/i.test(h)) return { ok: true, warn: 'QR de DEMOSTRACIÓN: apunta a una URL de EJEMPLO. No imprimir ni grabar en chips.' };
  return { ok: true };
}
function qrDataUrl(text, size) {
  return new Promise((res, rej) => {
    if (!window.QRCode) return rej(new Error('lib'));
    const box = document.createElement('div');
    try { new QRCode(box, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.H, colorDark: '#000000', colorLight: '#ffffff' }); } catch (e) { return rej(e); }
    setTimeout(() => { const c = box.querySelector('canvas'); c ? res(c.toDataURL('image/png')) : rej(new Error('canvas')); }, 60);
  });
}
async function drawQR(imgEl, msgEl, size) {
  const u = stableUrl(), chk = checkUrl(u);
  if (!chk.ok) { imgEl.hidden = true; msgEl.textContent = chk.msg; msgEl.className = 'note warn'; return; }
  try { imgEl.src = await qrDataUrl(u, size); imgEl.hidden = false; msgEl.textContent = chk.warn || ''; msgEl.className = chk.warn ? 'note warn' : 'note'; }
  catch (e) { imgEl.hidden = true; msgEl.textContent = 'No se pudo generar el QR (sin conexión o la biblioteca no cargó). Reintentá con internet.'; msgEl.className = 'note warn'; }
}
async function downloadQR() {
  const u = stableUrl(), chk = checkUrl(u);
  if (!chk.ok) { alert(chk.msg); return; }
  try {
    const im = new Image();
    await new Promise(async (ok, ko) => { im.onload = ok; im.onerror = ko; try { im.src = await qrDataUrl(u, 1024); } catch (e) { ko(e); } });
    const c = document.createElement('canvas'); c.width = 1280; c.height = 1440;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 1280, 1440); g.drawImage(im, 128, 128, 1024, 1024);
    g.fillStyle = '#000'; g.textAlign = 'center'; g.font = 'bold 64px system-ui,Arial'; g.fillText(CONFIG.pet.name, 640, 1260);
    g.fillStyle = '#444'; g.font = '36px system-ui,Arial'; g.fillText('VincularB Pet ID · escaneá para contactar al tutor', 640, 1330);
    if (checkUrl(u).warn) { g.fillStyle = '#c00'; g.font = 'bold 34px system-ui,Arial'; g.fillText('DEMO — URL de ejemplo', 640, 1390); }
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'QR-' + CONFIG.pet.name.replace(/[^\w-]+/g, '_') + '.png';
    document.body.append(a); a.click(); a.remove();
  } catch (e) { alert('No se pudo generar el QR para descargar. Revisá tu conexión e intentá de nuevo.'); }
}

/* ---------- vCard ---------- */
function downloadVcard() {
  const w = waNumber(CONFIG.owner.whatsapp); if (!w) return;
  const esc = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const o = CONFIG.owner, lines = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + esc(o.name + ' (tutor de ' + CONFIG.pet.name + ')'), 'N:;' + esc(o.name) + ';;;',
    'TEL;TYPE=CELL:+' + w, 'NOTE:' + esc('Tutor de ' + CONFIG.pet.name + ' · VincularB Pet ID')];
  const ig = igUrl(o.instagram); if (ig) lines.push('URL:' + ig);
  lines.push('END:VCARD');
  const url = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/vcard' }));
  const a = document.createElement('a'); a.href = url; a.download = 'tutor-' + CONFIG.pet.name.replace(/[^\w-]+/g, '_') + '.vcf';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- Render ---------- */
function btn(cls, iconName, label, extra) {
  const isLink = extra && extra.href;
  const n = el(isLink ? 'a' : 'button', Object.assign({ class: 'btn ' + cls }, isLink ? {} : { type: 'button' }, extra));
  n.append(icon(iconName), el('span', { text: label })); return n;
}
function build() {
  const { pet, owner, vb } = CONFIG, wa = waNumber(owner.whatsapp), lost = pet.status === 'lost';
  const wrap = el('div', { class: 'wrap' });
  if (CONFIG.demo) wrap.append(el('div', { class: 'demo-bar', role: 'note', text: 'DEMO COMERCIAL · el titular y los datos de salud son de EJEMPLO' }));

  const av = el('div', { class: 'avatar' });
  if (okImg(pet.avatar)) { const im = el('img', { src: pet.avatar, alt: 'Foto de ' + pet.name }); im.addEventListener('error', () => { im.remove(); av.append(icon('paw', 'ic')); }); av.append(im); }
  else av.append(icon('paw', 'ic'));
  const sub = [pet.breed, pet.species].filter(Boolean).join(' · ');
  wrap.append(el('header', { class: 'hero' },
    el('div', { class: 'cover' }, el('span', { class: 'brandtag', text: 'VincularB Pet ID' })),
    el('div', { class: 'id' }, av, el('h1', { text: pet.name }), sub && el('p', { class: 'sub', text: sub }),
      el('span', { class: 'badge ' + (lost ? 'lost' : 'safe'), role: 'status' }, el('i'), lost ? 'EXTRAVIADA – ayudá a volver a casa' : 'Mascota identificada'))));

  if (lost) wrap.append(el('div', { class: 'alert', role: 'alert' }, icon('alert', 'ic'),
    el('div', { text: pet.name + ' está extraviada. Si la encontraste, avisale ahora al tutor. Si parece herida, llevala a una veterinaria.' })));

  const act = el('section', { class: 'actions', 'aria-label': 'Contactar al tutor' });
  if (wa) {
    act.append(btn(lost ? 'danger' : 'primary', 'wa', 'Avisar a ' + owner.name.split(' ')[0] + ' por WhatsApp',
      { href: 'https://wa.me/' + wa + '?text=' + encodeURIComponent(fill(owner.waMessage, owner.name, pet.name)), target: '_blank', rel: 'noopener noreferrer' }));
    act.append(el('div', { class: 'grid2' }, btn('', 'phone', 'Llamar', { href: 'tel:+' + wa }), btn('accent', 'pin', 'Mi ubicación', { onclick: openGps })));
  } else act.append(el('p', { class: 'note warn', text: '[PENDIENTE] Falta un WhatsApp válido del tutor.' }));
  const ig = igUrl(owner.instagram), g3 = el('div', { class: 'grid2' });
  if (ig) g3.append(btn('', 'ig', 'Instagram', { href: ig, target: '_blank', rel: 'noopener noreferrer' }));
  if (wa) g3.append(btn('', 'user', 'Guardar contacto', { onclick: downloadVcard }));
  if (g3.children.length) act.append(g3);
  wrap.append(act);

  if (pet.description) wrap.append(el('section', { class: 'card' }, el('h2', { text: 'Sobre ' + pet.name }), el('p', { text: pet.description })));

  const rows = [['Raza', pet.breed], ['Nacimiento', birthText(pet.birth)], ['Edad', ageText(pet.birth)], ['Color', pet.color]].filter(r => r[1]);
  const kv = (title, r) => r.length ? el('section', { class: 'card' }, el('h2', { text: title }),
    el('dl', { class: 'kv' }, r.map(([k, v]) => el('div', null, el('dt', { text: k }), el('dd', { text: v }))))) : null;
  const tutor = [['Tutor', owner.name]]; if (owner.showPhone && wa) tutor.push(['WhatsApp', prettyPhone(wa)]);
  const extra = CONFIG.extra.filter(f => f.label && String(f.value || '').trim()).map(f => [f.label, f.value]);
  [kv('Datos de ' + pet.name, rows), kv('Salud e indicaciones', extra), kv('Tutor', tutor)].filter(Boolean).forEach(s => wrap.append(s));

  const imgs = pet.gallery.filter(okImg);
  if (imgs.length) {
    const gal = el('div', { class: 'gal' });
    imgs.forEach((src, i) => {
      const b = el('button', { type: 'button', 'aria-label': 'Ampliar foto ' + (i + 1) + ' de ' + pet.name }, el('img', { src, alt: 'Foto ' + (i + 1) + ' de ' + pet.name, loading: 'lazy' }));
      b.addEventListener('click', () => { $('lightImg').src = src; $('lightImg').alt = 'Foto de ' + pet.name; $('lightDlg').showModal(); }); gal.append(b);
    });
    wrap.append(el('section', { class: 'card' }, el('h2', { text: 'Fotos' }), gal));
  }

  const qimg = el('img', { alt: 'Código QR de la ficha de ' + pet.name, hidden: true }), qmsg = el('p', { class: 'note', role: 'status' });
  wrap.append(el('section', { class: 'card' }, el('h2', { text: 'Código QR de esta ficha' }),
    el('div', { class: 'qrbox' }, qimg, el('div', { class: 'side' }, btn('', 'qr', 'Ampliar QR', { onclick: openQr }), btn('', 'dl', 'Descargar QR', { onclick: downloadQR }), qmsg))));
  drawQR(qimg, qmsg, 320);

  wrap.append(el('section', { class: 'card' }, el('details', { class: 'how' }, el('summary', { text: '¿Cómo leer esta ficha?' }),
    el('h3', { text: 'Con NFC' }), el('ol', null, el('li', { text: 'Activá el NFC del celular (Ajustes).' }), el('li', { text: 'Acercá la parte trasera del celular al chip del collar o la chapita.' }), el('li', { text: 'Tocá el aviso que aparece para abrir la ficha.' })),
    el('h3', { text: 'Con QR' }), el('ol', null, el('li', { text: 'Abrí la cámara del celular.' }), el('li', { text: 'Apuntala al código QR y tocá el enlace.' })))));

  wrap.append(el('section', { class: 'card legal', 'aria-label': 'Aviso legal' }, el('h2', { text: 'Privacidad y aviso legal' }),
    el('p', { text: 'Esta ficha es informativa y la mantiene el administrador del sistema con los datos que aporta el tutor. Los datos de salud no reemplazan la consulta con un veterinario.' }),
    el('p', { text: 'Tu ubicación solo se comparte si vos apretás el botón y aceptás el permiso del navegador; nunca se envía automáticamente.' }),
    el('p', { text: 'Vincular Business no se responsabiliza por la exactitud de los datos cargados ni por el resultado de un extravío.' })));

  const vbw = waNumber(vb.whatsapp), links = el('div', { class: 'links' });
  if (vbw) links.append(el('a', { href: 'https://wa.me/' + vbw + '?text=' + encodeURIComponent('Hola Vincular Business, vi la ficha VincularB Pet ID y quiero más información.'), target: '_blank', rel: 'noopener noreferrer', text: 'WhatsApp ' + '(' + vbw.slice(3, 6) + ') ' + vbw.slice(6) }));
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vb.email)) links.append(el('a', { class: 'alt', href: 'mailto:' + vb.email, text: vb.email }));
  const web = safeUrl(vb.web); if (web) links.append(el('a', { class: 'alt', href: web, target: '_blank', rel: 'noopener noreferrer', text: 'Contratá tu ficha' }));
  wrap.append(el('footer', { class: 'vb', 'aria-label': 'Vincular Business' },
    okImg(vb.logo) ? el('img', { class: 'logo', src: vb.logo, alt: vb.name }) : el('strong', { text: vb.name }),
    el('p', { text: vb.desc }), links.children.length ? links : null));
  wrap.append(el('p', { class: 'ver', text: 'VincularB Pet ID v' + CONFIG.version }));
  return wrap;
}
async function openQr() { $('qrDlg').showModal(); await drawQR($('qrBig'), $('qrBigMsg'), 640); }
function openGps() { $('gpsMsg').textContent = ''; $('gpsSend').hidden = true; $('gpsMap').hidden = true; $('gpsDlg').showModal(); }

$('gpsGo').addEventListener('click', () => {
  const m = $('gpsMsg');
  if (!('geolocation' in navigator)) { m.textContent = 'Tu navegador no permite obtener la ubicación. Describile al tutor dónde estás.'; return; }
  m.textContent = 'Pidiendo permiso y buscando tu ubicación…';
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: la, longitude: lo, accuracy: ac } = pos.coords;
    const maps = 'https://www.google.com/maps?q=' + la.toFixed(6) + ',' + lo.toFixed(6), wa = waNumber(CONFIG.owner.whatsapp);
    const text = fill(CONFIG.owner.waMessage, CONFIG.owner.name, CONFIG.pet.name) + '\nMi ubicación: ' + maps;
    m.textContent = 'Ubicación obtenida (precisión aprox. ' + Math.round(ac) + ' m). Revisá el mensaje antes de enviarlo.';
    $('gpsMap').href = maps; $('gpsMap').hidden = false;
    if (wa) { $('gpsSend').href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(text); $('gpsSend').hidden = false; }
  }, err => {
    m.textContent = err.code === 1 ? 'No diste permiso de ubicación. Podés avisar al tutor por WhatsApp sin compartirla.'
      : err.code === 2 ? 'No se pudo determinar tu ubicación. Probá en un lugar con mejor señal.' : 'Se agotó el tiempo esperando la ubicación. Intentá de nuevo.';
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});
$('lightClose').addEventListener('click', () => $('lightDlg').close());
$('lightDlg').addEventListener('click', e => { if (e.target === $('lightDlg')) $('lightDlg').close(); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => $(b.dataset.close).close()));
$('qrDownload').addEventListener('click', downloadQR);

function render() { document.title = CONFIG.pet.name + ' · VincularB Pet ID'; $('app').replaceChildren(build()); }
render();
window.addEventListener('load', () => { if (window.QRCode) render(); });
</script>
